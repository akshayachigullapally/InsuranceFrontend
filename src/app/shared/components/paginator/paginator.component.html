<div class="flex items-center justify-between px-4 py-3">
  <div class="text-sm text-gray-600">
    Showing page <span class="font-medium">{{ page() }}</span>
  </div>
  <div class="flex gap-2">
    <button
      type="button"
      class="rounded-md border border-gray-300 px-3 py-1 text-sm font-medium text-gray-700 disabled:cursor-not-allowed disabled:opacity-50 hover:bg-gray-50"
      [disabled]="page() <= 1"
      (click)="previous.emit()"
    >
      Previous
    </button>
    <button
      type="button"
      class="rounded-md border border-gray-300 px-3 py-1 text-sm font-medium text-gray-700 disabled:cursor-not-allowed disabled:opacity-50 hover:bg-gray-50"
      [disabled]="disableNext()"
      (click)="next.emit()"
    >
      Next
    </button>
  </div>
</div>
