<aside class="panel">
  <div class="panel-grid" aria-hidden="true"></div>
  <div class="panel-glow" aria-hidden="true"></div>

  <div class="panel-content">
    <!-- Logo with radar pulses -->
    <div class="radar" aria-hidden="true">
      <span class="radar-pulse"></span>
      <span class="radar-pulse radar-pulse--delay-1"></span>
      <span class="radar-pulse radar-pulse--delay-2"></span>
      <span class="radar-ring"></span>

      <div class="logo-tile">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="url(#authBrandGradient)" />
          <path
            d="M16 8C12.6863 8 10 10.6863 10 14C10 15.5835 10.6375 17.012 11.7148 18.075L16 22L20.2852 18.075C21.3625 17.012 22 15.5835 22 14C22 10.6863 19.3137 8 16 8Z"
            fill="white"
            opacity="0.95"
          />
          <path
            d="M16 12C14.8954 12 14 12.8954 14 14C14 15.1046 14.8954 16 16 16C17.1046 16 18 15.1046 18 14C18 12.8954 17.1046 12 16 12Z"
            fill="url(#authBrandGradient)"
          />
          <defs>
            <linearGradient
              id="authBrandGradient"
              x1="0"
              y1="0"
              x2="32"
              y2="32"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#1e8bff" />
              <stop offset="100%" stop-color="#0041b1" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <p class="wordmark">ClimateSure</p>
    <h2 class="headline">
      {{ copy().headline }} <span class="gradient-text">{{ copy().highlight }}</span>
    </h2>
    <p class="body">{{ copy().body }}</p>
  </div>

  <p class="panel-footer">© 2026 ClimateSure Insurance</p>
</aside>
