<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-navy-900/50 p-4 backdrop-blur-sm animate-fade-in"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirmation-dialog-title"
  (click)="cancel()"
>
  <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-elevated animate-fade-in-up" (click)="$event.stopPropagation()">
    <div class="flex items-start gap-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-lg"
        [class]="danger() ? 'bg-danger-50 text-danger-700' : 'bg-brand-50 text-brand-700'"
        aria-hidden="true"
      >
        {{ danger() ? '!' : '?' }}
      </span>
      <div class="min-w-0 flex-1">
        <h2 id="confirmation-dialog-title" class="text-base font-semibold text-gray-900">{{ title() }}</h2>
        @if (message()) {
          <p class="mt-1.5 text-sm leading-relaxed text-gray-600">{{ message() }}</p>
        }
        <ng-content />
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-3">
      <button type="button" class="btn-outline !px-4 !py-2" (click)="cancel()">
        {{ cancelLabel() }}
      </button>
      <button type="button" class="!px-4 !py-2" [class]="confirmClass()" (click)="confirm()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
