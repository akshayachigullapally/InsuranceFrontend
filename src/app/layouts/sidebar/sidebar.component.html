<aside class="w-60 shrink-0 border-r border-brand-100 bg-white/80 backdrop-blur lg:w-64">
  <nav class="sticky top-16 space-y-6 p-4">
    <div class="space-y-1">
      @for (link of links(); track link.routerLink) {
        <a
          class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-600 transition-all duration-150 hover:translate-x-0.5 hover:bg-brand-50 hover:text-brand-700"
          routerLinkActive="!bg-brand-gradient !text-white shadow-md"
          [routerLink]="link.routerLink"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <span class="text-base transition-transform duration-150 group-hover:scale-110" aria-hidden="true">{{ link.icon }}</span>
          <span>{{ link.label }}</span>
        </a>
      }
    </div>
    <div class="relative overflow-hidden rounded-lg bg-brand-gradient p-3 text-xs text-white shadow-md">
      <span class="absolute -right-4 -top-4 size-16 rounded-full bg-white/10 blur-xl"></span>
      <p class="font-semibold">ClimateSure platform</p>
      <p class="mt-1 text-brand-100">Parametric insurance — protected by real-time data.</p>
    </div>
  </nav>
</aside>
